[package]
name = "torrenttui"
version = "0.14.1"
edition = "2021"
# Stated in the README and CONTRIBUTING; declared here so cargo enforces it
# with a clear message instead of failing deep inside a dependency.
rust-version = "1.95"
description = "A terminal BitTorrent client for magnet link downloads"
license = "MIT"
repository = "https://github.com/thijsvos/torrentTUI"
homepage = "https://github.com/thijsvos/torrentTUI"
# crates.io caps both at 5; keywords are <=20 chars, alphanumeric/-/_.
keywords = ["bittorrent", "torrent", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "network-programming"]
# `assets/demo.gif` alone is 1.29 MB of a 2.09 MB tracked tree — 62% of the
# published tarball, already-compressed so gzip cannot reclaim it, and useless
# to anyone building from source. crates.io renders the README with images
# resolved against `repository`, so the gif does not need to ship to display.
#
# Do NOT add README.md here: `src/actions.rs` reads it at test time through
# CARGO_MANIFEST_DIR to prove the keybinding tables match the action registry.
exclude = ["assets/*", "demo.tape"]

[dependencies]
# TUI
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# BitTorrent engine. `http-api` exposes librqbit's built-in axum server, which
# we bind to localhost only and use as the source of HTTP file-stream URLs that
# external media players can open. `tracing-subscriber-utils` is required by
# the http-api crate (its `/stream_logs` handler references a method that only
# exists with that feature).
librqbit = { version = "9", default-features = false, features = ["rust-tls", "watch", "http-api", "tracing-subscriber-utils"] }
# librqbit 9's `make_http_api_and_run` takes this crate's listener type instead
# of tokio's, and librqbit does not re-export it. Keep the version in lockstep
# with what librqbit itself depends on.
librqbit-dualstack-sockets = "0.7"

# Async runtime
# `signal` is needed for the headless session to shut down cleanly on SIGTERM
# (service managers, `docker stop`) instead of dying mid-flush. It pulls in no
# new crates: libc, mio and signal-hook-registry are already in Cargo.lock.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3"

# Serialization and config. The `rc` feature is required so that librqbit's
# http-api handlers can derive `Deserialize` on path-extractor structs that
# contain `Arc<str>` fields (since librqbit 8.1.1).
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1.0"

# Utilities
dirs = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
fs4 = "1"
notify-rust = "4"
# Watch-folder cleanup walks the same tree librqbit's watcher does; using the
# same crate keeps the traversal semantics (depth limit, no symlink following,
# files only) identical to `librqbit::watch`.
walkdir = "2"
# Socket options for the listen-port probe. librqbit binds its real listener
# with SO_REUSEADDR, so a probe without it is stricter than the bind it is
# predicting and walks past ports librqbit could have used. Already in the
# lockfile via tokio — no new crate, same argument as `url` below.
socket2 = "0.6"

# Terminal column accounting. Torrent names are attacker-controlled, and a
# CJK/emoji name counted by `char` occupies twice its width, shoving the
# adjacent columns off screen.
unicode-width = "0.2"

# Indexer search (apibay / torrents-csv). The feature set is a subset of what
# librqbit already enables on the shared reqwest build (0.13 calls the TLS
# feature `rustls`, not `rustls-tls`), so this adds no second TLS stack and no
# new crates to the lockfile.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "socks"] }
# Percent-encoding for indexer query strings and the dn=/tr= params of locally
# built magnet links; already in the graph transitively via url.
percent-encoding = "2"
# URL parsing: used to classify magnet `tr=` trackers by scheme EXACTLY the way
# librqbit does (so the proxy-mode udp strip can't be bypassed by a crafted
# magnet the two parsers disagree on) and to build correct `file://` blocklist
# URLs. Already in the graph transitively via librqbit/reqwest — no new crate.
url = "2"

# Liveness check for the pid in the daemon record. Without it a session killed
# with SIGKILL leaves a record whose heartbeat is still fresh, and the next
# launch refuses to start for the whole staleness window — a crash is far more
# common than the unreliable-locking case the heartbeat guards against.
# Already in the lockfile via tokio, so this adds no crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Same job on Windows: `OpenProcess` + `GetExitCodeProcess` is the cheapest way
# to ask whether a pid is still running. Without it a session killed from Task
# Manager — the normal way to kill things on Windows — blocked the next launch
# for the whole heartbeat window. Already in the lockfile via tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
