name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Format and lint run only on Linux — they're platform-independent and
  # running them three times wastes CI minutes.
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Tests run on every OS we ship release artifacts for, so platform-specific
  # regressions (path separators, terminal capabilities, notify-rust backend)
  # are caught at PR time instead of release-build time.
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Run tests
        run: cargo test --all

      # The session lock, the control channel and the background session need
      # two real processes contending for one lock, so no unit test reaches
      # them — and they are exactly where the platforms differ (`flock` is
      # advisory, `LockFileEx` is mandatory). Cheap to run, and it caught a
      # stale-lock bug that every unit test passed straight through.
      - name: Build binary for the session end-to-end check
        run: cargo build

      - name: Session end-to-end check
        run: python3 scripts/e2e_session.py target/debug/torrenttui
        shell: bash

  # `rust-version = "1.95"` is asserted in Cargo.toml, the README and
  # CONTRIBUTING, and until now every toolchain in both workflows was `@stable`
  # — so the claim was never once tested and could have been wrong for months.
  #
  # This verifies the promise rather than discovering the real floor (which is
  # currently 1.89, set by notify-rust). `cargo msrv` would find the floor but
  # bisects across toolchains, recompiling from cold each time; one pinned
  # check is a fraction of the cost and answers the question we actually make
  # to users. `--locked` matters: without it this could resolve newer
  # dependency versions than the ones we ship and test a different graph.
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check against the declared MSRV
        run: cargo check --all-targets --locked

  # The README documents a Docker workflow and dependabot watches the base
  # images monthly, but nothing ever built the file — so it could rot silently.
  # Build only: no push, no registry auth, no build args.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t torrenttui:ci .

      - name: Check the binary runs in the image
        run: docker run --rm --entrypoint torrenttui torrenttui:ci --version

  # The crate is publish-ready but deliberately unpublished. This keeps that
  # true: `--dry-run` packages and builds the tarball exactly as `cargo publish`
  # would, so a missing `license`, a broken `exclude`, or a file the build needs
  # that is not shipped all fail here instead of at the moment someone finally
  # decides to publish. It contacts no registry and needs no token.
  package:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: package

      - name: Verify the crate would publish
        run: cargo publish --dry-run --locked

      # README.md must survive `exclude`: src/actions.rs reads it at test time
      # through CARGO_MANIFEST_DIR, and assets/demo.gif must not, being 62% of
      # the tarball. Both are one careless edit away from flipping.
      - name: Check the packaged file list
        run: |
          LIST=$(cargo package --list --locked)
          echo "$LIST"
          echo "$LIST" | grep -qx 'README.md' || { echo '::error::README.md missing from the package'; exit 1; }
          ! echo "$LIST" | grep -q 'assets/' || { echo '::error::assets/ leaked into the package'; exit 1; }

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
