name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write
  # actions/attest-build-provenance needs id-token + attestations to publish
  # a Sigstore-backed provenance attestation alongside each release artifact.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Matches ci.yml. Without it the test job below would lint more weakly than
  # the CI run that guarded the PR, which defeats the point of the gate.
  RUSTFLAGS: -D warnings

jobs:
  check-version:
    name: Check for version change
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if version tag exists
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # The gate. Releases are triggered by a version-bump commit pushed straight
  # to main, so no PR review stands between a mistake and five signed binaries
  # — this workflow previously ran no tests at all.
  #
  # Deliberately a job here rather than a `workflow_run` on ci.yml: both
  # workflows fire on the same `push: main` with different concurrency groups,
  # so they run concurrently and never observe each other, and ci.yml has no
  # `workflow_call` trigger or aggregate "all green" job to depend on. One
  # runner is enough — the full OS matrix already ran on the PR that produced
  # the commit.
  test:
    name: Test before release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all --locked

  build-release:
    name: Build ${{ matrix.name }}
    needs: [check-version, test]
    # `needs.test.result` is named explicitly rather than relying on GitHub's
    # implicit "skip if a dependency failed". That implicit rule is what an
    # `if:` referencing `needs.*.result` exists to override — which this
    # condition already does for the tag path, where `check-version` is
    # deliberately skipped. Leaving `test` unnamed here would be betting the
    # whole gate on which of those two behaviours wins.
    if: |
      needs.test.result == 'success' &&
      ((needs.check-version.result == 'success' && needs.check-version.outputs.should_release == 'true') ||
       (needs.check-version.result == 'skipped' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: torrenttui-linux-x86_64
            ext: ""
          - name: Linux aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: torrenttui-linux-aarch64
            ext: ""
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: torrenttui-macos-x86_64
            ext: ""
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: torrenttui-macos-aarch64
            ext: ""
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: torrenttui-windows-x86_64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Pinned to a specific commit, not a released version: the newest cross
      # on crates.io is 0.2.5 (Feb 2023), which predates target support this
      # build relies on — hence the git install. Unpinned, though, whatever sat
      # on main at build time shaped an artifact that then received a provenance
      # attestation. This rev is what main pointed at on 2026-08-19, so the pin
      # changes nothing about today's output; it just stops it drifting.
      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cargo install cross --locked \
            --git https://github.com/cross-rs/cross \
            --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross-compile)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --locked --target ${{ matrix.target }}

      # The binary is the whole release asset. Tarballs and .sha256 files used
      # to ship alongside it, but a checksum next to the file it checks proves
      # nothing the Sigstore attestation below does not prove better — and
      # four files per platform made the release page hard to read.
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/torrenttui ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cp target/${{ matrix.target }}/release/torrenttui.exe ${{ matrix.artifact }}.exe

      # Attest the binary itself. Users can verify with:
      #   gh attestation verify <binary> --repo thijsvos/torrentTUI
      - name: Attest binary provenance (Unix)
        if: runner.os != 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Attest binary provenance (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.artifact }}.exe

      # Workflow artifacts only exist to carry the binary to the publish job;
      # the release assets are the copy that matters. One day of retention
      # keeps the Actions tab from accumulating a second, unsigned set.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}
          retention-days: 1

  create-macos-universal:
    name: Create macOS Universal Binary
    needs: build-release
    runs-on: macos-latest
    steps:
      - name: Download x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: torrenttui-macos-x86_64

      - name: Download aarch64 binary
        uses: actions/download-artifact@v8
        with:
          name: torrenttui-macos-aarch64

      - name: Combine
        run: |
          lipo -create torrenttui-macos-x86_64 torrenttui-macos-aarch64 -output torrenttui-macos-universal
          chmod +x torrenttui-macos-universal

      - name: Attest universal binary provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: torrenttui-macos-universal

      - name: Upload universal binary
        uses: actions/upload-artifact@v7
        with:
          name: torrenttui-macos-universal
          path: torrenttui-macos-universal
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [check-version, build-release, create-macos-universal]
    if: always() && needs.build-release.result == 'success' && needs.create-macos-universal.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create tag (if from main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Exactly six files: five targets plus the macOS universal binary.
      - name: Collect release files
        run: |
          mkdir release-files
          find artifacts -type f -name "torrenttui-*" -exec cp {} release-files/ \;
          ls -la release-files/
          test "$(ls release-files | wc -l)" -eq 6

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Find the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from ${PREV_TAG} to HEAD"
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges | grep -v "^- Trigger release" || true)
          else
            echo "No previous tag found, using all commits"
            CHANGES=$(git log --pretty=format:"- %s" --no-merges | grep -v "^- Trigger release" || true)
          fi
          # Write to file to preserve formatting
          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "## Installation"
            echo ""
            echo "Download the binary for your platform and place it in your PATH."
            echo ""
            echo "**Linux (x86_64):**"
            echo "\`\`\`bash"
            echo "chmod +x torrenttui-linux-x86_64"
            echo "sudo mv torrenttui-linux-x86_64 /usr/local/bin/torrenttui"
            echo "\`\`\`"
            echo ""
            echo "**macOS (Universal):**"
            echo "\`\`\`bash"
            echo "chmod +x torrenttui-macos-universal"
            echo "sudo mv torrenttui-macos-universal /usr/local/bin/torrenttui"
            echo "\`\`\`"
            echo ""
            echo "**Windows:**"
            echo "Download \`torrenttui-windows-x86_64.exe\` and add its directory to your PATH."
            echo ""
            echo "Every binary carries a Sigstore build-provenance attestation. Verify one with:"
            echo "\`\`\`bash"
            echo "gh attestation verify <binary> --repo thijsvos/torrentTUI"
            echo "\`\`\`"
          } > changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: TorrentTUI ${{ steps.version.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
